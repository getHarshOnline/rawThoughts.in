  <script type="application/ld+json">{"@context":{"@version":1.1,"@vocab":"https://schema.org/","url":{"@id":"https://schema.org/url","@type":"@id"}},"@id":"https://rawthoughts.in/products/","@type":"WebPage","creativeWorkStatus":"published","description":"Together the products form one system a person runs, with people deciding, and each part except Scope, which brings context from Pale, Weave or both, can also be used alone.","hasPart":[{"@id":"_:faq_0fcbdff93a0f46181b2db05887f2dae398f4d20b2c39a0114ab72bdf66f04285","@type":"FAQPage","isPartOf":{"@id":"https://rawthoughts.in/products/","identifier":"content:rawthoughts-products"},"mainEntity":[{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eStart with a task: \u003ca href=\"https://rawthoughts.in/pale/materialize-repository-guidance/\" data-gazette-link=\"content:rawthoughts-products#link-10\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:pale-materialize-repository-guidance\" data-gazette-destination-site=\"site:rawthoughts\" data-gazette-destination-theme=\"theme:carrier\"\u003egive coding agents shared repository instructions\u003c/a\u003e, \u003ca href=\"https://rawthoughts.in/gazette/first-publication/\" data-gazette-link=\"content:rawthoughts-products#link-11\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:gazette-docs\" data-gazette-destination-site=\"site:rawthoughts\" data-gazette-destination-theme=\"theme:carrier\"\u003ebuild a publication\u003c/a\u003e or \u003ca href=\"https://rawthoughts.in/rawfish/rehearse-a-decision/\" data-gazette-link=\"content:rawthoughts-products#link-12\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:rawfish-docs\" data-gazette-destination-site=\"site:rawthoughts\" data-gazette-destination-theme=\"theme:carrier\"\u003ework through a RawFish rehearsal\u003c/a\u003e. The first two run from a local source build, and each guide says what you need before you begin. RawFish\u0027s guide reads without installing anything, because the retained prototype covers only part of the rehearsal it describes.\u003c/p\u003e\n"},"name":"How can I try the products?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eHow does a person or an organisation form a working picture of its work, act through it, learn from what follows and stay accountable as agents do more of the work? Each product answers a part of it, and each can be used alone except Scope, which brings its context from Pale, Weave or both. Weave keeps the records, Scope brings the context a task needs, Counsel judges where rules leave a choice, RawFish rehearses a direction before anyone commits to it, Gazette publishes a body of thought, and Pale is the meta harness through which they act, a harness over the tools people already use.\u003c/p\u003e\n"},"name":"What question do these products answer?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eTogether the products form one system a person runs, with people deciding: the records hold the world, something is observed, a person decides what to do about it, a direction can be tried before anyone commits to it, the act goes out, and its outcome returns as a record that shapes what is learned next. What joins them is one problem: agents decide far more often than people, so by the time an agent writes, what it read has usually changed. A read says what else to read, and a write is tried for what it affects before it goes in; \u003ca href=\"https://rawthoughts.in/collections/systems/\" data-gazette-link=\"content:rawthoughts-products#link-13\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"collection:rawthoughts-systems\" data-gazette-destination-site=\"site:rawthoughts\" data-gazette-destination-theme=\"theme:carrier\"\u003ethe Systems collection\u003c/a\u003e follows that through the parts. Pale\u0027s local tools, Gazette and \u003ca href=\"https://causality.in/reckon/\" data-gazette-link=\"content:rawthoughts-products#link-14\" data-gazette-destination-kind=\"cross-site\" data-gazette-destination-content=\"content:causality-project-reckon\" data-gazette-destination-site=\"site:causality\" data-gazette-destination-site-name=\"Causality\" data-gazette-destination-theme=\"theme:lattice\"\u003eReckon’s\u003c/a\u003e laboratory run today and the other parts join one at a time; each product\u0027s page says what runs and the problem in front of it.\u003c/p\u003e\n\u003cp\u003eIn the integrated system, requests for Scope’s context, Counsel’s judgment and Reckon’s evaluation pass through Pale. Scope always works with Pale, Weave or both: Weave keeps the records and points to the files around them, Pale keeps the history of what each piece of work relied on and what followed, and Scope combines the two into one account an agent can ask for what it needs. Without Pale, Scope is how an agent reads Weave. Harsh describes three sides that keep the system improving safely: the recursive self-improvement side, where Microsoft\u0027s SkillOpt, Reckon and Counsel are joined by Pale\u0027s genealogy, its history of what each piece of work relied on and what followed, and improve the methods between runs; the continual-learning side, where a person\u0027s workspace and Pale\u0027s SDKs, language server, VS Code extension and MCP let a person and their agent keep rewriting the description of their world; and the context engineering and alignment side, where Scope, that genealogy and Weave give each act the context it needs and keep it within bounds. Gazette builds publications from the sources you select and does not call Scope, Counsel or Reckon; supplying it an organisation\u0027s permitted Weave records is the connection in front. RawFish rehearses a decision through a simulated world. Reckon, under Causality, supplies the separate evaluation instrument. \u003ca href=\"https://rawthoughts.in/pale/understand-your-world/\" data-gazette-link=\"content:rawthoughts-products#link-15\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:pale-docs\" data-gazette-destination-site=\"site:rawthoughts\" data-gazette-destination-theme=\"theme:carrier\"\u003ePale’s introduction\u003c/a\u003e explains how those contributions fit without moving their records or decisions into one application.\u003c/p\u003e\n\u003cp\u003eWeave alone is a headless Jira and Salesforce, a database with a capable interface, and that is an intended way to use it. Pale alone is a hook runtime and context declaration engine that asks you to tune your files and knowledge closely, an orchestrator of agent sandboxes and a permission system for agents. Together they give something more: people and agents working inside one organisation and across several, each instance kept separate, reads and writes delegated across instances, and a structured memory for people and agents, serving the same headless Jira and Salesforce to both.\u003c/p\u003e\n"},"name":"How do these products fit together?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eOpen a product’s guides to understand it or try a supported workflow. Use the developer docs at docs.rawthoughts.in to build the product, integrate with its code or extend it.\u003c/p\u003e\n"},"name":"Where should I start reading?"}]},{"@type":"ItemList","itemListElement":[{"@type":"ListItem","item":{"@id":"https://rawthoughts.in/pale/#entity","@type":"SoftwareApplication","url":"https://rawthoughts.in/pale/"},"name":"Pale","position":1},{"@type":"ListItem","item":{"@id":"https://rawthoughts.in/scope/#entity","@type":"SoftwareApplication","url":"https://rawthoughts.in/scope/"},"name":"Scope","position":2},{"@type":"ListItem","item":{"@id":"https://rawthoughts.in/counsel/#entity","@type":"SoftwareApplication","url":"https://rawthoughts.in/counsel/"},"name":"Counsel","position":3},{"@type":"ListItem","item":{"@id":"https://rawthoughts.in/weave/#entity","@type":"SoftwareApplication","url":"https://rawthoughts.in/weave/"},"name":"Weave","position":4},{"@type":"ListItem","item":{"@id":"https://rawthoughts.in/gazette/#entity","@type":"SoftwareApplication","url":"https://rawthoughts.in/gazette/"},"name":"Gazette","position":5},{"@type":"ListItem","item":{"@id":"https://rawthoughts.in/rawfish/#entity","@type":"SoftwareApplication","url":"https://rawthoughts.in/rawfish/"},"name":"RawFish","position":6}],"numberOfItems":6}],"http://www.w3.org/ns/prov#wasGeneratedBy":{"@type":"http://www.w3.org/ns/prov#Activity","http://www.w3.org/ns/prov#used":[{"@id":"https://rawthoughts.in/gazette/"},{"@id":"https://github.com/getHarshOnline/gazette-theme-carrier"}]},"identifier":"content:rawthoughts-products","image":[{"@type":"ImageObject","contentUrl":"https://rawthoughts.in/products/media/film-c001.webp","description":"Sunlight falls through a long sequence of rock arches towards a distant gold disc."},{"@type":"ImageObject","contentUrl":"https://rawthoughts.in/products/media/film-c073.webp","description":"A sunlit rock passage leads through successive arches towards a gold disc."},{"@type":"ImageObject","contentUrl":"https://rawthoughts.in/products/media/film-c121.webp","description":"The rock corridor opens towards a gold disc cut with a crescent."},{"@type":"ImageObject","contentUrl":"https://rawthoughts.in/products/media/film-c181.webp","description":"A gold disc hangs in a shaft of light beyond the last rock arch."},{"@type":"ImageObject","contentUrl":"https://rawthoughts.in/products/media/film-c241.webp","description":"Sunlight catches the edge of a crescent-cut gold disc suspended in a rock chamber."},{"@type":"ImageObject","contentUrl":"https://rawthoughts.in/products/media/film-c361.webp","description":"A gold disc with a crescent cutout hangs in a shaft of light at the end of the passage."}],"inLanguage":"en","name":"Products","potentialAction":[{"@type":"ViewAction","target":"https://causality.in/"},{"@type":"ViewAction","target":"https://post-agi-economics.org/"},{"@type":"ViewAction","target":"https://rawthoughts.in/collections/systems/"},{"@type":"ViewAction","target":"https://rawthoughts.in/services/"}],"publisher":{"@id":"https://rawthoughts.in/#organization","@type":"Organization","identifier":"organization:rtepl","name":"RawThoughts Enterprises Private Limited","sameAs":[{"@id":"https://github.com/getHarshOnline"}],"url":"https://rawthoughts.in/"},"text":"Sunlight falls through a long sequence of rock arches towards a distant gold disc.\nPale\nWrite your world once, and Pale compiles it into the permissions and context the coding tools you already use ask for at every step.\nA sunlit rock passage leads through successive arches towards a gold disc.\nScope\nThe smallest fresh account of a task, with its sources, decisions, people and open questions intact.\nThe rock corridor opens towards a gold disc cut with a crescent.\nCounsel\nLocal judgment where rules leave a choice, with a separate model service to help Scope find useful context, with Pale or over Weave alone.\nA gold disc hangs in a shaft of light beyond the last rock arch.\nWeave\nCustomer relationships and work tracking together as one set of records for an organisation whose members include people and agents, so that whoever comes next can pick up the story.\nSunlight catches the edge of a crescent-cut gold disc suspended in a rock chamber.\nGazette\nA semantic publishing compiler that turns connected writing, research and documentation into distinct publications from one shared model.\nA gold disc with a crescent cutout hangs in a shaft of light at the end of the passage.\nRawFish\nTry a creator, workplace or civic decision in a simulated world first.\nFurther questions\nHow the parts work as one system\nThe Systems collection follows the design in essays: why the architecture needs a reason to exist, how context helps the task, what judgment can learn from, and how rehearsing a decision tries a direction first.\nRead the essays\nCapability and its consequences\nPost-AGI Economics is an independent publication examining constraints, ownership and household income as cognitive capability becomes cheaper.\nExplore the publication\nWhat a representation can preserve\nCausality asks how representations can change without losing what matters, what a minimal adaptive unit would need, and how many units could learn to organise. Its research projects develop those questions at different stages.\nExplore the research\nQuestions about the products\nHow can I try the products?\nStart with a task: give coding agents shared repository instructions, build a publication or work through a RawFish rehearsal. The first two run from a local source build, and each guide says what you need before you begin. RawFish\u0027s guide reads without installing anything, because the retained prototype covers only part of the rehearsal it describes.\nWhat question do these products answer?\nHow does a person or an organisation form a working picture of its work, act through it, learn from what follows and stay accountable as agents do more of the work? Each product answers a part of it, and each can be used alone except Scope, which brings its context from Pale, Weave or both. Weave keeps the records, Scope brings the context a task needs, Counsel judges where rules leave a choice, RawFish rehearses a direction before anyone commits to it, Gazette publishes a body of thought, and Pale is the meta harness through which they act, a harness over the tools people already use.\nHow do these products fit together?\nTogether the products form one system a person runs, with people deciding: the records hold the world, something is observed, a person decides what to do about it, a direction can be tried before anyone commits to it, the act goes out, and its outcome returns as a record that shapes what is learned next. What joins them is one problem: agents decide far more often than people, so by the time an agent writes, what it read has usually changed. A read says what else to read, and a write is tried for what it affects before it goes in; the Systems collection follows that through the parts. Pale\u0027s local tools, Gazette and Reckon’s laboratory run today and the other parts join one at a time; each product\u0027s page says what runs and the problem in front of it.\nIn the integrated system, requests for Scope’s context, Counsel’s judgment and Reckon’s evaluation pass through Pale. Scope always works with Pale, Weave or both: Weave keeps the records and points to the files around them, Pale keeps the history of what each piece of work relied on and what followed, and Scope combines the two into one account an agent can ask for what it needs. Without Pale, Scope is how an agent reads Weave. Harsh describes three sides that keep the system improving safely: the recursive self-improvement side, where Microsoft\u0027s SkillOpt, Reckon and Counsel are joined by Pale\u0027s genealogy, its history of what each piece of work relied on and what followed, and improve the methods between runs; the continual-learning side, where a person\u0027s workspace and Pale\u0027s SDKs, language server, VS Code extension and MCP let a person and their agent keep rewriting the description of their world; and the context engineering and alignment side, where Scope, that genealogy and Weave give each act the context it needs and keep it within bounds. Gazette builds publications from the sources you select and does not call Scope, Counsel or Reckon; supplying it an organisation\u0027s permitted Weave records is the connection in front. RawFish rehearses a decision through a simulated world. Reckon, under Causality, supplies the separate evaluation instrument. Pale’s introduction explains how those contributions fit without moving their records or decisions into one application.\nWeave alone is a headless Jira and Salesforce, a database with a capable interface, and that is an intended way to use it. Pale alone is a hook runtime and context declaration engine that asks you to tune your files and knowledge closely, an orchestrator of agent sandboxes and a permission system for agents. Together they give something more: people and agents working inside one organisation and across several, each instance kept separate, reads and writes delegated across instances, and a structured memory for people and agents, serving the same headless Jira and Salesforce to both.\nWhere should I start reading?\nOpen a product’s guides to understand it or try a supported workflow. Use the developer docs at docs.rawthoughts.in to build the product, integrate with its code or extend it.\n","url":"https://rawthoughts.in/products/","usageInfo":{"@id":"https://rawthoughts.in/terms/"}}</script>
