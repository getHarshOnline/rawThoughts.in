<svg xmlns="http://www.w3.org/2000/svg" width="420" height="875" viewBox="0 0 420 875" role="img" aria-labelledby="world-title world-desc">
  <title id="world-title">From a workspace to connected applications</title>
  <desc id="world-desc">A workspace and reusable packages feed the compiler. Its fixed generation configures the resident engine. Hosts call the engine through the SDK. Two-way connections run through ports, an application integration and a technical adapter to an application that keeps its own records.</desc>
