<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="opportunity-tracks-title"><title id="opportunity-tracks-title">Across three reviews, renewal continues while new-service access is offered, becomes unavailable and returns as a narrower dataset, with a workshop still proposed.</title><rect width="400" height="500" fill="rgb(11.37% 8.24% 7.45%)"/><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="70" y="30" font-weight="600">New service</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="346" y="30" font-weight="600" text-anchor="middle">Renewal</text><path d="M346 86 V430" fill="none" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="2"></path><path d="M70 86 V190 M70 274 V355" fill="none" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="2"></path><path d="M63 226 L77 240 M63 240 L77 226" fill="none" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="2"></path><text font-family="var(--world-type-display-family, 'Space Grotesk', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="18" y="92" >1</text><circle cx="346" cy="86" r="4" fill="rgb(92.94% 90.2% 83.92%)"></circle><circle cx="70" cy="86" r="5" fill="rgb(11.37% 8.24% 7.45%)" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="2"></circle><text font-family="var(--world-type-display-family, 'Space Grotesk', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="18" y="239" >2</text><circle cx="346" cy="233" r="4" fill="rgb(92.94% 90.2% 83.92%)"></circle><text font-family="var(--world-type-display-family, 'Space Grotesk', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="18" y="371" >3</text><circle cx="346" cy="365" r="4" fill="rgb(92.94% 90.2% 83.92%)"></circle><circle cx="70" cy="365" r="5" fill="rgb(11.37% 8.24% 7.45%)" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="2"></circle><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="91">Access offered</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="121">Assess the problem</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="225">Access unavailable</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="255">Assessment blocked</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="360">Narrower dataset</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="390">Reassess the scope</text><path d="M70 370 V445" fill="none" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="1.5" stroke-dasharray="3 5"></path><circle cx="70" cy="451" r="6" fill="rgb(11.37% 8.24% 7.45%)" stroke="rgb(92.94% 90.2% 83.92%)" stroke-width="1.5"></circle><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="447">Workshop</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="98" y="475">proposed</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(92.94% 90.2% 83.92%)" x="346" y="462" text-anchor="middle">Continues</text></svg>
